# AUTO-GENERATED by 19_score_all_configs pipeline -- DO NOT EDIT.
# Identical to code/llm_study/config.yaml except paths.output_dir, which is
# redirected to outputs/llm_study/tools_off/ so aggregating the TOOLS-OFF slice
# never writes into paths the live tools-on run_study.py process uses.
# =============================================================================
# LLM parameter study -- single configuration file
# =============================================================================
# Every tunable lives here: model IDs + pricing, temperature, repeats, the
# species source, the prompts dir, the tool setting, the output dir and the
# synonym map. Nothing in the Python modules hardcodes a model ID or a price.

# --- The configuration grid -------------------------------------------------
# MODEL: three Claude tiers. `id` strings are what the API receives -- update
# them here when models move on; nothing else needs touching.
models:
  haiku:
    id: claude-haiku-4-5
    tier: haiku
    # USD per million tokens.
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 5.00
    # Haiku 4.5 accepts `temperature`. Sonnet 5 / Opus 5 reject it (HTTP 400);
    # the runner drops the parameter for any model with this set to false.
    supports_temperature: true
  sonnet:
    id: claude-sonnet-5
    tier: sonnet
    # $3/$15 standard. An introductory $2/$10 applied through 2026-08-31; set
    # those rates here if the run happened inside that window and you want the
    # manifest cost to match the invoice.
    input_usd_per_mtok: 3.00
    output_usd_per_mtok: 15.00
    supports_temperature: false
  opus:
    id: claude-opus-5
    tier: opus
    input_usd_per_mtok: 5.00
    output_usd_per_mtok: 25.00
    supports_temperature: false

# TOOLS: on/off. `off` = the model answers from its own knowledge only.
# `on` = server-side web search. The tool `type` is version-pinned to what the
# installed anthropic SDK supports (0.75.0 ships web_search_20250305 only; the
# newer web_search_20260209 with dynamic filtering needs a much newer SDK).
tools:
  web_search:
    type: web_search_20250305
    name: web_search
    max_uses: 5

# REPEATS: each (model, prompt, tools, species) cell is run this many times so
# stochastic variance is measurable.
repeats: 3

# Sampling / call parameters.
temperature: 0.0
max_tokens: 2000

# --- Species ----------------------------------------------------------------
# The 41-species study set, read from the CANONICAL single source of truth
# `code/focal_species.json` (loader: code/focal_species.py). Every source --
# eBird data, RSPB Handbook coding, this LLM study and the expert survey --
# reads that same file, so the species sets cannot drift apart.
#
# NOT the study set, and deliberately not used here:
#   code/ebirdst/bocc_birds/red_list.json     70 name-only BoCC entries
#   species_list.json -> red_list_available   50-species availability set
species:
  source: code/focal_species.json
  # The name shown to the model. The British vernacular ("Slavonian grebe") is
  # preferred over the eBird/American form ("Horned Grebe") because the study is
  # about UK literature; the loader falls back to common_name where the canonical
  # file records no separate British name.
  prompt_name_column: red_list_name
  expected_count: 41   # hard assertion; the runner exits if this is not met

# --- Paths ------------------------------------------------------------------
paths:
  prompts_dir: code/llm_study/prompts
  categories: code/llm_study/categories.json
  output_dir: outputs/llm_study/tools_off

# --- Robustness / cost control ----------------------------------------------
retry:
  max_attempts: 5        # total attempts per call (1 initial + 4 retries)
  base_delay_seconds: 1.0
  max_delay_seconds: 60.0
  jitter: true

concurrency:
  default: 1             # sequential by default
  max: 8                 # hard cap even if --concurrency asks for more

# Token guesses used ONLY by --dry-run to estimate cost before spending money.
dry_run_estimate:
  input_tokens_per_call: 400
  output_tokens_per_call: 600
  # Tools-on calls carry search results back into context, so they cost more.
  tools_on_input_multiplier: 4.0

# --- Parsing ----------------------------------------------------------------
# Seed synonym map, keyed by category slug. Matching is case-insensitive and
# whole-word. Tune freely: parse.py is standalone and re-runnable over
# raw_calls.jsonl, so improving these costs no API calls.
synonyms:
  woodland:           [woodland, forest, trees, plantation, copse, wood]
  arable:             [arable, crop, cropland, tilled, cultivated, horticulture]
  improved_grassland: [improved grassland, pasture, grazing, silage, hay, ley]
  seminat_grassland:  [semi-natural grassland, seminatural grassland, rough grassland,
                       meadow, downland, reedbed, fen, marsh, swamp]
  mountain_heath_bog: [moor, moorland, heath, heathland, bog, upland, montane,
                       mountain, crag, scree]
  saltwater:          [sea, marine, open sea, offshore, pelagic, inshore]
  freshwater:         [lake, reservoir, pond, river, stream, canal, gravel pit,
                       freshwater, open water]
  coastal:            [coast, coastal, estuary, mudflat, saltmarsh, beach, shingle,
                       dune, rocky shore, intertidal]
  builtup:            [urban, suburban, town, city, village, garden, park, built-up,
                       builtup, industrial]

# Ambiguous terms that map to MORE THAN ONE category and flag the call as
# low-confidence for review. "farmland" spans Arable and Improved Grassland; it
# only triggers when the text offers no finer detail (i.e. no arable-specific or
# grassland-specific synonym was matched anywhere).
ambiguous_terms:
  farmland: [arable, improved_grassland]
  agricultural: [arable, improved_grassland]
